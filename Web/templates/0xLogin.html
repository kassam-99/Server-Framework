<!DOCTYPE html>
<html lang="en">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>Login Page</title>
    <style>
        @font-face {
            font-family: 'Hacked';
            src: url("{{ url_for('static', filename='fonts/HACKED.ttf') }}") format('truetype');
            font-weight: normal;
        }
        * {
            margin: 0;
            padding: 0;
            box-sizing: border-box;
            font-family: 'Hacked';
        }

        body {
            display: flex;
            justify-content: center;
            align-items: center;
            min-height: 100vh;
            background-image: url("{{ url_for('static', filename='0xgif.gif') }}");
        }
        

        .login-container {
            background: #000000;
            padding: 5vw; /* Responsive padding */
            border-radius: 10px;
            box-shadow: 0 0 15px rgba(0, 0, 0, 0.3);
            width: 90%; /* Flexible width */
            max-width: 500px; /* Max width for desktop */
            margin: 20px; /* Margin for small screens */
        }

        .login-container h2 {
            text-align: center;
            margin-bottom: 20px;
            color: #cc0000;
            font-size: clamp(1.5rem, 5vw, 2.5rem); /* Responsive font size */
        }

        .logo-container {
            width: 50vw; /* Responsive width */
            height: 50vw; /* Keeps it circular and responsive */
            max-width: 250px; /* Max size for desktop */
            max-height: 250px;
            margin: 0 auto 30px;
            border-radius: 50%;
            display: flex;
            align-items: center;
            justify-content: center;
            overflow: hidden;
        }

        .logo-container img {
            width: 100%;
            height: 100%;
            object-fit: contain;
        }

        .form-group {
            margin-bottom: 20px;
        }

        .form-group label {
            display: block;
            margin-bottom: 5px;
            color: #FFFFFF;
            
            font-size: clamp(0.9rem, 3vw, 1rem); /* Responsive label size */
        }

        .form-group input {
            width: 100%;
            padding: clamp(8px, 2vw, 12px); /* Responsive padding */
            border: 1px solid #ccc;
            border-radius: 5px;
            font-size: clamp(0.9rem, 3vw, 1rem); /* Responsive font size */
            background: #f5f5f5;
        }

        .form-group input:focus {
            outline: none;
            border-color: #cc0000;
            box-shadow: 0 0 5px rgba(204, 0, 0, 0.3);
        }

        .login-btn {
            width: 100%;
            padding: clamp(8px, 2vw, 12px); /* Responsive padding */
            background: #cc0000;
            border: none;
            border-radius: 5px;
            color: white;
            font-size: clamp(0.9rem, 3vw, 1rem); /* Responsive font size */
            cursor: pointer;
            transition: background 0.3s;
        }

        .login-btn:hover {
            background: #990000;
        }

        .error {
            color: #cc0000;
            text-align: center;
            margin-top: 15px;
            font-size: clamp(0.8rem, 2.5vw, 0.875rem); /* Responsive error text */
        }

        /* Media Queries for Fine-Tuning */
        @media (max-width: 600px) {
            .login-container {
                padding: 20px; /* Smaller padding on phones */
                max-width: 100%; /* Full width on small screens */
            }

            .logo-container {
                width: 40vw; /* Smaller GIF on phones */
                height: 40vw;
                max-width: 200px;
                max-height: 200px;
            }
        }

        @media (min-width: 601px) and (max-width: 1024px) {
            .login-container {
                max-width: 450px; /* Slightly smaller for tablets */
            }

            .logo-container {
                width: 45vw;
                height: 45vw;
                max-width: 225px;
                max-height: 225px;
            }
        }
    </style>
</head>
<body>
    <div class="login-container">
        <h2>0xThe_Spider_Web</h2>
        <div class="logo-container">
            <img src="{{ url_for('static', filename='0xspider.gif') }}" alt="Animated Logo">
        </div>
        <form method="POST" action="/login">
            <div class="form-group">
                <label for="username">Username</label>
                <input type="text" id="username" name="username" placeholder="Enter username" required>
            </div>
            <div class="form-group">
                <label for="password">Password</label>
                <input type="password" id="password" name="password" placeholder="Enter password" required>
            </div>
            <button type="submit" class="login-btn">Login</button>
        </form>
        {% if error %}
            <p class="error">{{ error }}</p>
        {% endif %}
    </div>
</body>
</html>
